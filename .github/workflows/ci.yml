name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - name: Windows PowerShell installer syntax and encoding
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $path = $_.FullName
            if (@([IO.File]::ReadAllBytes($path) | Where-Object { $_ -gt 127 }).Count) {
              throw "$path must be ASCII-only for Windows PowerShell 5.1 and irm | iex."
            }
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Syntax check
        shell: bash
        run: for f in server/*.js server/sources/*.js public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Translations complete
        run: npm run i18n:check
      - name: Disabled update alerts and manual release checks
        run: node scripts/update-alerts-check.mjs
      - name: Windows installation regression checks
        run: node scripts/windows-install-check.mjs
      - name: Chat image regression checks
        run: node scripts/chat-images-check.mjs
      - name: OpenCode db / legacy storage checks
        run: node scripts/opencode-storage-check.mjs
      - name: OpenCode model list checks (CRLF, refresh after install / sign-in)
        run: node scripts/opencode-models-check.mjs
      - name: Codex default-model fallback checks
        run: node scripts/codex-fallback-check.mjs
      - name: Composer @ picker checks
        if: runner.os != 'Windows' # creates symlinks, which need admin rights there
        run: node scripts/mention-check.mjs
      - name: New skill (create / edit / copy / delete) checks
        run: node scripts/skill-create-check.mjs
      - name: Add MCP (templates, per-project config, protocol test, install job) checks
        run: node scripts/mcp-install-check.mjs
      - name: Independent installation and port checks
        run: node scripts/listener-check.mjs
      - name: Compatibility table from GitHub
        run: node scripts/compat-remote-check.mjs
      - name: Boot the server and hit every endpoint
        run: node scripts/ci-boot.mjs
