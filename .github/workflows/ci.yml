name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - name: Windows PowerShell installer syntax and encoding
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $path = $_.FullName
            if (@([IO.File]::ReadAllBytes($path) | Where-Object { $_ -gt 127 }).Count) {
              throw "$path must be ASCII-only for Windows PowerShell 5.1 and irm | iex."
            }
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Offline regression suite (isolated installation)
        run: npm test
  browser:
    name: Chromium reconnect and questions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/baton-browser" --no-save playwright@1.64.1
          "$RUNNER_TEMP/baton-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production renderer and SSE in desktop/mobile viewports
        run: BATON_PLAYWRIGHT="$RUNNER_TEMP/baton-browser/node_modules/playwright" npm run test:browser
