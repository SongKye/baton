name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - name: Syntax check
        shell: bash
        run: for f in server/*.js server/sources/*.js public/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Translations complete
        run: npm run i18n:check
      - name: Chat image regression checks
        run: node scripts/chat-images-check.mjs
      - name: Composer @ picker checks
        if: runner.os != 'Windows' # creates symlinks, which need admin rights there
        run: node scripts/mention-check.mjs
      - name: Boot the server and hit every endpoint
        run: node scripts/ci-boot.mjs
