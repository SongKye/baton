name: Release

# Push a tag like v0.2.0 -> a GitHub Release with notes from CHANGELOG.md and a ready-to-run zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Build zip (source + dependencies, ready to run)
        run: |
          npm ci --omit=dev
          name="baton-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          git archive HEAD | tar -x -C "dist/$name"
          cp -r node_modules "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/baton-${GITHUB_REF_NAME}.zip" --title "Baton $GITHUB_REF_NAME" --notes-file notes.md
