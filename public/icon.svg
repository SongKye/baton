<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="surface" x1="80" y1="0" x2="420" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30342F"/><stop offset="1" stop-color="#141916"/>
    </linearGradient>
    <linearGradient id="ember" x1="264" y1="112" x2="344" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBA78"/><stop offset=".5" stop-color="#FF8D50"/><stop offset="1" stop-color="#EF683C"/>
    </linearGradient>
    <linearGradient id="ivory" x1="168" y1="180" x2="248" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E9"/><stop offset="1" stop-color="#D9DEC9"/>
    </linearGradient>
    <linearGradient id="edge" x1="100" y1="0" x2="370" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".17"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#surface)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" stroke="url(#edge)" stroke-width="2"/>
  <!-- Two staggered batons: one session hands off to the next. -->
  <g transform="rotate(35 256 256)">
    <rect x="168" y="188" width="80" height="212" rx="40" fill="#080D09" opacity=".24"/>
    <rect x="264" y="120" width="80" height="212" rx="40" fill="#080D09" opacity=".24"/>
    <rect x="168" y="180" width="80" height="212" rx="40" fill="url(#ivory)"/>
    <rect x="264" y="112" width="80" height="212" rx="40" fill="url(#ember)"/>
    <rect x="169" y="181" width="78" height="210" rx="39" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
    <rect x="265" y="113" width="78" height="210" rx="39" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
